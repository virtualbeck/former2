# Former2 nginx site config with the server-side helper reverse-proxied at /ssr.
# Mount this over /etc/nginx/conf.d/default.conf in the nginx container.

server {
    listen       8080;
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-side helper (util/ssr.js). Lets the app reach S3/IAM/etc. without
    # the browser extension. Set the app's "Helper endpoint" setting to "/ssr".
    location /ssr {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 75m;
    }
}
